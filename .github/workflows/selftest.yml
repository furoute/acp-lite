name: selftest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: acp-lite 自测
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装 cryptography（自测签名路径必需，缺了开局即红）
        run: pip install cryptography

      - name: 跑 selftest.py
        run: python selftest.py
